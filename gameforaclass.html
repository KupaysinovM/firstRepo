<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penalty Shootout Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #000;
      -webkit-text-fill-color: white;
    }
    #gameArea {
      margin: 20px auto;
      width: 300px;
      padding: 20px;
      border: 2px solid #000;
      border-radius: 10px;
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      -webkit-text-fill-color: black;
    }
    button:hover {
            background-color: black;
            -webkit-text-fill-color: rgb(30, 0, 255);
            border: white 10px;
        }
    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      border: white 3px;
    }
  </style>
</head>
<body>
  <h1>Penalty Shootout Game</h1>
  <div id="gameArea">
    <p>Choose your shot direction:</p>
    <button onclick="shoot('left')">Left</button>
    <button onclick="shoot('center')">Center</button>
    <button onclick="shoot('right')">Right</button>
    <p id="result"></p>
  </div>

  <script>
    function shoot(playerChoice) {
      const directions = ['left', 'center', 'right'];
      const goalkeeperChoice = directions[Math.floor(Math.random() * directions.length)];
      
      if (playerChoice === goalkeeperChoice) {
        document.getElementById('result').innerText = `Goalkeeper dives ${goalkeeperChoice} and saves your shoot! Saved! 😞`;
      } else {
        document.getElementById('result').innerText = `Goalkeeper dives ${goalkeeperChoice} and you scored a goal! Goal! 🎉`;
      }
    }
  </script>
</body>
</html>
