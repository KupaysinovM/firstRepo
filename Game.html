<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Change Game with Advanced Features</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #222;
            color: white;
        }
        h1, h2 {
            color: white;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid white;
            color: white;
            background-color: black;
            transition: background-color 0.3s, color 0.3s;
        }
        button:hover {
            background-color: white;
            color: black;
        }
        #gameButton {
            font-size: 18px;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            display: none;
            transition: background-color 0.3s, color 0.3s;
        }
        #gameButton:hover {
            background-color: darkgreen;
        }
        .menu {
            margin: 20px 0;
        }
        #settings {
            display: none;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 300px;
            background-color: white;
            text-align: left;
            color: black;
        }
        #leaderboard {
            display: none;
            margin-top: 20px;
            background-color: white;
            color: black;
            padding: 10px;
            border-radius: 8px;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <h1>Color Change Game</h1>
    <div class="menu">
        <button id="startButton">Start Game</button>
        <button id="instructionsButton">Instructions</button>
        <button id="settingsButton">Settings</button>
        <button id="leaderboardButton">Leaderboard</button>
        <button id="quitButton">Quit</button>
    </div>
    <button id="gameButton" style="background-color: green;">Click Me!</button>
    <div id="settings">
        <h2>Settings</h2>
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
        </select>
        <label for="backgroundColor">Background Color:</label>
        <input type="color" id="backgroundColor" value="#222222">
        <button id="saveSettingsButton">Save Settings</button>
    </div>
    <div id="leaderboard">
        <h2>Leaderboard</h2>
        <ul id="scoreList"></ul>
    </div>
    <script>
        let gameButton = document.getElementById('gameButton');
        let startButton = document.getElementById('startButton');
        let instructionsButton = document.getElementById('instructionsButton');
        let quitButton = document.getElementById('quitButton');
        let settingsButton = document.getElementById('settingsButton');
        let leaderboardButton = document.getElementById('leaderboardButton');
        let settingsPanel = document.getElementById('settings');
        let saveSettingsButton = document.getElementById('saveSettingsButton');
        let backgroundColorInput = document.getElementById('backgroundColor');
        let difficultySelect = document.getElementById('difficulty');
        let leaderboard = document.getElementById('leaderboard');
        let scoreList = document.getElementById('scoreList');

        let gameStarted = false;
        let isRed = false;
        let startTime, reactionTime;
        let scores = [];

        startButton.addEventListener('click', () => {
            gameButton.style.display = 'inline-block';
            startGame();
        });

        instructionsButton.addEventListener('click', () => {
            alert('Instructions: Click the button when it turns red as fast as possible!');
        });

        settingsButton.addEventListener('click', () => {
            settingsPanel.style.display = 'block';
        });

        leaderboardButton.addEventListener('click', () => {
            leaderboard.style.display = leaderboard.style.display === 'block' ? 'none' : 'block';
        });

        quitButton.addEventListener('click', () => {
            alert('You quit the game.');
            resetGame();
            gameButton.style.display = 'none';
        });

        saveSettingsButton.addEventListener('click', () => {
            document.body.style.backgroundColor = backgroundColorInput.value;
            settingsPanel.style.display = 'none';
        });

        gameButton.addEventListener('click', () => {
            if (!gameStarted) {
                alert('Press Start to begin.');
                return;
            }

            if (isRed) {
                reactionTime = (Date.now() - startTime) / 1000;
                alert(`You won! Reaction Time: ${reactionTime}s`);
                scores.push(reactionTime);
                updateLeaderboard();
                resetGame();
            } else {
                alert('Too early! Try again.');
                resetGame();
            }
        });

        function startGame() {
            gameStarted = true;
            let delay = getDifficultyDelay();
            setTimeout(() => {
                gameButton.style.backgroundColor = 'red';
                isRed = true;
                startTime = Date.now();
            }, delay);
        }

        function resetGame() {
            gameStarted = false;
            isRed = false;
            gameButton.style.backgroundColor = 'green';
        }

        function getDifficultyDelay() {
            switch (difficultySelect.value) {
                case 'easy': return Math.random() * 2000 + 1000;
                case 'medium': return Math.random() * 1500 + 1000;
                case 'hard': return Math.random() * 1000 + 500;
            }
        }

        function updateLeaderboard() {
            scoreList.innerHTML = '';
            scores.sort((a, b) => a - b);
            scores.slice(0, 5).forEach(score => {
                let li = document.createElement('li');
                li.textContent = `${score.toFixed(3)}s`;
                scoreList.appendChild(li);
            });
        }
    </script>
</body>
</html>
